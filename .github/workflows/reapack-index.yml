name: ReaPack Index

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate ReaPack index
        run: npx reapack-index
      - name: Commit index.xml
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.xml
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: update ReaPack index.xml [skip ci]"
          git push
